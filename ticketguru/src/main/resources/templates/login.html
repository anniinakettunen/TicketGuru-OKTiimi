<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Kirjaudu sisään</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%;">
      <h3 class="text-center mb-4">Kirjaudu sisään</h3>
      <form action="/login" method="post">
        <div class="mb-3">
          <label for="username" class="form-label">Käyttäjänimi</label>
          <input type="text" class="form-control" id="username" name="username" required autofocus>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Salasana</label>
          <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Kirjaudu</button>
        </div>
      </form>
      <div id="error-message" class="alert alert-danger mt-3 d-none">
        Virheellinen käyttäjänimi tai salasana
      </div>
      <div id="logout-message" class="alert alert-success mt-3 d-none">
        Olet kirjautunut ulos
      </div>
    </div>
  </div>
  <script>
    if (window.location.search.includes("error")) {
      document.getElementById("error-message").classList.remove("d-none");
    }
    if (window.location.search.includes("logout")) {
      document.getElementById("logout-message").classList.remove("d-none");
    }
  </script>
</body>
</html>
