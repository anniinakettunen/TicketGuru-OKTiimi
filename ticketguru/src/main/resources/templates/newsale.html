<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Ticket Sale</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
</head>
<body>
    <h1>New Ticket Sale</h1>
    <form th:action="@{/ticketsales/savesale}" th:object="${ticketSale}" method="post">
        
        <label for="userId">User:</label>
        <select id="userId" name="userId" required>
            <option value="" disabled selected>Select a user</option>
            <option th:each="user : ${users}" 
                    th:value="${user.id}" 
                    th:text="${user.firstname + ' ' + user.lastname}"></option>
        </select>
        <br><br>

        <label for="dateTime">Date & Time:</label>
        <input type="datetime-local" id="dateTime" th:field="*{dateTime}" required>
        <br><br>

        <label for="price">Price:</label>
        <input type="number" id="price" th:field="*{price}" step="0.01" min="0" required>
        <br><br>

        <button type="submit">Submit Sale</button>
    </form>
</body>
</html>
