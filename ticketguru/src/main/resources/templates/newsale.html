<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Ticket Sale</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <style>
        .ticket-quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }
        .quantity-btn {
            width: 40px;
            height: 40px;
            border: 1px solid #ccc;
            background-color: #f8f9fa;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
        }
        .quantity-btn:hover {
            background-color: #e9ecef;
        }
        .quantity-input {
            width: 60px;
            text-align: center;
            border: 1px solid #ccc;
            padding: 8px;
        }
        .ticket-type-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .user-search-container {
            position: relative;
        }
        .user-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            border-top: none;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }
        .user-option {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }
        .user-option:hover {
            background-color: #f8f9fa;
        }
        .user-option:last-child {
            border-bottom: none;
        }
        .user-info {
            font-size: 0.9em;
            color: #666;
        }
        .event-search-container {
            position: relative;
        }
        .event-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            border-top: none;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }
        .event-option {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }
        .event-option:hover {
            background-color: #f8f9fa;
        }
        .event-option:last-child {
            border-bottom: none;
        }
        .event-info {
            font-size: 0.9em;
            color: #666;
        }
        .event-date {
            font-size: 0.8em;
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1>New Ticket Sale</h1>
        <form th:action="@{/ticketsales/savesale}" th:object="${ticketSale}" method="post">
            
            <div class="mb-3">
                <label for="userSearch" class="form-label">User:</label>
                <div class="user-search-container">
                    <input type="text" 
                           id="userSearch" 
                           class="form-control" 
                           placeholder="Search by name or email..." 
                           autocomplete="off"
                           oninput="filterUsers()"
                           onfocus="showUserDropdown()"
                           required>
                    <input type="hidden" id="userId" name="userId" required>
                    <div id="userDropdown" class="user-dropdown">
                        <div th:each="user : ${users}" 
                             class="user-option" 
                             th:attr="data-user-id=${user.id}, data-user-name=${user.firstname + ' ' + user.lastname}, data-search-text=${user.firstname + ' ' + user.lastname + ' ' + user.email}">
                            <div th:text="${user.firstname + ' ' + user.lastname}"></div>
                            <div class="user-info" th:text="${user.email}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="eventSearch" class="form-label">Event:</label>
                <div class="event-search-container">
                    <input type="text" 
                           id="eventSearch" 
                           class="form-control" 
                           placeholder="Search by event name, location, or city..." 
                           autocomplete="off"
                           oninput="filterEvents()"
                           onfocus="showEventDropdown()"
                           required>
                    <input type="hidden" id="eventId" name="eventId" required>
                    <input type="hidden" id="dateTime" th:field="*{dateTime}">
                    <div id="eventDropdown" class="event-dropdown">
                        <div th:each="event : ${events}" 
                             class="event-option" 
                             th:attr="data-event-id=${event.eventId}, data-event-name=${event.eventName}, data-search-text=${event.eventName + ' ' + event.eventLocation + ' ' + event.eventCity}">
                            <div th:text="${event.eventName}"></div>
                            <div class="event-info" th:text="${event.eventLocation + ', ' + event.eventCity}"></div>
                            <div class="event-date" th:text="${event.eventDate}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <h3>Select Tickets</h3>
                <div th:each="ticketType : ${tickettypes}" class="ticket-type-card">
                    <div class="row align-items-center">
                        <div class="col-md-4">
                            <h5 th:text="${ticketType.ticketName}"></h5>
                            <p class="text-muted mb-0">Price: €<span th:text="${#numbers.formatDecimal(ticketType.price, 1, 2)}"></span></p>
                        </div>
                        <div class="col-md-4">
                            <div class="ticket-quantity-control">
                                <button type="button" class="quantity-btn" th:onclick="'decrementQuantity(' + ${ticketType.ticketTypeId} + ')'">-</button>
                                <input type="number" 
                                       th:id="'quantity-' + ${ticketType.ticketTypeId}" 
                                       th:name="'ticketQuantities[' + ${ticketType.ticketTypeId} + ']'"
                                       class="quantity-input" 
                                       value="0" 
                                       min="0" 
                                       max="100"
                                       th:onchange="'updateTotalPrice()'">
                                <button type="button" class="quantity-btn" th:onclick="'incrementQuantity(' + ${ticketType.ticketTypeId} + ')'">+</button>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <p class="mb-0">Subtotal: €<span th:id="'subtotal-' + ${ticketType.ticketTypeId}">0.00</span></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="price" class="form-label">Total Price:</label>
                <input type="number" id="price" th:field="*{price}" step="0.01" min="0" class="form-control" readonly>
            </div>

            <button type="submit" class="btn btn-primary">Submit Sale</button>
            <a href="/ticketsales" class="btn btn-secondary ms-2">Cancel</a>
        </form>
    </div>

    <!-- Hidden inputs to pass ticket prices to JavaScript -->
    <div style="display: none;">
        <span th:each="ticketType : ${tickettypes}" 
              th:attr="data-ticket-id=${ticketType.ticketTypeId}, data-ticket-price=${ticketType.price}"
              class="ticket-price-data"></span>
    </div>

    <script>
        const ticketPrices = {};
        
        // Initialize ticket prices from hidden data elements
        document.querySelectorAll('.ticket-price-data').forEach(function(element) {
            const ticketId = element.getAttribute('data-ticket-id');
            const ticketPrice = parseFloat(element.getAttribute('data-ticket-price'));
            ticketPrices[ticketId] = ticketPrice;
        });

        // User search functionality
        function filterUsers() {
            const searchInput = document.getElementById('userSearch');
            const dropdown = document.getElementById('userDropdown');
            const searchText = searchInput.value.toLowerCase();
            const userOptions = dropdown.querySelectorAll('.user-option');

            let hasVisibleOptions = false;

            userOptions.forEach(option => {
                const searchData = option.getAttribute('data-search-text').toLowerCase();
                if (searchData.includes(searchText)) {
                    option.style.display = 'block';
                    hasVisibleOptions = true;
                } else {
                    option.style.display = 'none';
                }
            });

            // Show dropdown if there are visible options and search text is not empty
            if (hasVisibleOptions && searchText.length > 0) {
                dropdown.style.display = 'block';
            } else if (searchText.length === 0) {
                dropdown.style.display = 'block';
            } else {
                dropdown.style.display = 'none';
            }
        }

        function showUserDropdown() {
            const dropdown = document.getElementById('userDropdown');
            dropdown.style.display = 'block';
        }

        function selectUser(userId, userName) {
            document.getElementById('userId').value = userId;
            document.getElementById('userSearch').value = userName;
            document.getElementById('userDropdown').style.display = 'none';
        }

        // Event search functionality
        function filterEvents() {
            const searchInput = document.getElementById('eventSearch');
            const dropdown = document.getElementById('eventDropdown');
            const searchText = searchInput.value.toLowerCase();
            const eventOptions = dropdown.querySelectorAll('.event-option');

            let hasVisibleOptions = false;

            eventOptions.forEach(option => {
                const searchData = option.getAttribute('data-search-text').toLowerCase();
                if (searchData.includes(searchText)) {
                    option.style.display = 'block';
                    hasVisibleOptions = true;
                } else {
                    option.style.display = 'none';
                }
            });

            // Show dropdown if there are visible options and search text is not empty
            if (hasVisibleOptions && searchText.length > 0) {
                dropdown.style.display = 'block';
            } else if (searchText.length === 0) {
                dropdown.style.display = 'block';
            } else {
                dropdown.style.display = 'none';
            }
        }

        function showEventDropdown() {
            const dropdown = document.getElementById('eventDropdown');
            dropdown.style.display = 'block';
        }

        function selectEvent(eventId, eventName) {
            document.getElementById('eventId').value = eventId;
            document.getElementById('eventSearch').value = eventName;
            document.getElementById('eventDropdown').style.display = 'none';
        }

        // Hide dropdowns when clicking outside
        document.addEventListener('click', function(event) {
            const userContainer = document.querySelector('.user-search-container');
            const eventContainer = document.querySelector('.event-search-container');
            
            if (userContainer && !userContainer.contains(event.target)) {
                document.getElementById('userDropdown').style.display = 'none';
            }
            
            if (eventContainer && !eventContainer.contains(event.target)) {
                document.getElementById('eventDropdown').style.display = 'none';
            }
        });

        // Handle user selection clicks
        document.addEventListener('DOMContentLoaded', function() {
            // Set current datetime
            const now = new Date();
            const isoString = now.toISOString().slice(0, 16);
            document.getElementById('dateTime').value = isoString;

            const userOptions = document.querySelectorAll('.user-option');
            userOptions.forEach(option => {
                option.addEventListener('click', function() {
                    const userId = this.getAttribute('data-user-id');
                    const userName = this.getAttribute('data-user-name');
                    selectUser(userId, userName);
                });
            });

            const eventOptions = document.querySelectorAll('.event-option');
            eventOptions.forEach(option => {
                option.addEventListener('click', function() {
                    const eventId = this.getAttribute('data-event-id');
                    const eventName = this.getAttribute('data-event-name');
                    selectEvent(eventId, eventName);
                });
            });
        });

        function incrementQuantity(ticketTypeId) {
            const quantityInput = document.getElementById('quantity-' + ticketTypeId);
            const currentValue = parseInt(quantityInput.value) || 0;
            if (currentValue < parseInt(quantityInput.max)) {
                quantityInput.value = currentValue + 1;
                updateSubtotal(ticketTypeId);
                updateTotalPrice();
            }
        }

        function decrementQuantity(ticketTypeId) {
            const quantityInput = document.getElementById('quantity-' + ticketTypeId);
            const currentValue = parseInt(quantityInput.value) || 0;
            if (currentValue > 0) {
                quantityInput.value = currentValue - 1;
                updateSubtotal(ticketTypeId);
                updateTotalPrice();
            }
        }

        function updateSubtotal(ticketTypeId) {
            const quantity = parseInt(document.getElementById('quantity-' + ticketTypeId).value) || 0;
            const price = ticketPrices[ticketTypeId] || 0;
            const subtotal = quantity * price;
            document.getElementById('subtotal-' + ticketTypeId).textContent = subtotal.toFixed(2);
        }

        function updateTotalPrice() {
            let total = 0;
            Object.keys(ticketPrices).forEach(ticketTypeId => {
                const quantity = parseInt(document.getElementById('quantity-' + ticketTypeId).value) || 0;
                const price = ticketPrices[ticketTypeId] || 0;
                total += quantity * price;
            });
            document.getElementById('price').value = total.toFixed(2);
        }

        document.addEventListener('DOMContentLoaded', function() {
            Object.keys(ticketPrices).forEach(ticketTypeId => {
                updateSubtotal(ticketTypeId);
            });
            updateTotalPrice();
        });
    </script>
</body>
</html>
