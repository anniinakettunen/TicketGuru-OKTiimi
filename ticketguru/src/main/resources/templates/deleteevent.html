<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Poista tapahtuma</title>
    <link rel="stylesheet" th:href="@{/css/bookstart.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
</head>
<body class="container mt-5">

    <h2 class="mb-4">Vahvista tapahtuman poisto</h2>

    <div class="alert alert-warning">
        <p>Haluatko varmasti poistaa tapahtuman <strong th:text="${event.eventName}">Tapahtuma</strong>?</p>
    </div>

    <form th:action="@{'/events/delete/' + ${event.id}}" method="post">
        <button type="submit" class="btn btn-danger">Poista</button>
        <a th:href="@{/events/list}" class="btn btn-outline-secondary ms-2">Peruuta</a>
    </form>

    <div th:replace="fragments/footer :: footer"></div>

</body>
</html>
