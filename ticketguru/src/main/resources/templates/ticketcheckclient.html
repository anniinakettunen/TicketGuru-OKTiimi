<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <title>Ticket Check</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    input {
      padding: 8px;
      margin-right: 10px;
    }
    button {
      padding: 8px 12px;
      cursor: pointer;
    }
    #ticketInfo {
      margin-top: 15px;
    }
    #useButton {
      margin-top: 10px;
      margin-bottom: 10px;
    }
    .success {
      color: blue;
      font-weight: bold;
      margin-top: 15px;
    }
    .error {
      color: red;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <h2>Check Ticket</h2>

  <input type="text" id="lippu_id" placeholder="Enter ticket ID" />
  <button onclick="fetchTicket()">Hae tiedot</button>

  <div id="ticketInfo"></div>
  <button id="useButton" style="display:none" onclick="markUsed()">Merkitse käytetyksi</button>

  <script>
    const API_BASE_URL = 'https://ticketguru-git-ticketguru.2.rahtiapp.fi/api';
    const username = "admin";   
    const password = "admin";  

    const headers = new Headers();
    headers.set("Authorization", "Basic " + btoa(username + ":" + password));
    headers.set("Content-Type", "application/json");

    let currentTicketId = null;

    // --- FETCH TICKET INFO ---
    async function fetchTicket() {
      const ticketId = document.getElementById("lippu_id").value.trim();
      const ticketDiv = document.getElementById("ticketInfo");
      const useBtn = document.getElementById("useButton");
      ticketDiv.textContent = "Haetaan...";
      ticketDiv.className = "";

      try {
        const response = await fetch(`${API_BASE_URL}/liput/${ticketId}`, {
          method: "GET",
          headers: headers,
        });

        if (response.status === 404) {
          ticketDiv.textContent = "Lippua ei löytynyt.";
          ticketDiv.className = "error";
          useBtn.style.display = "none";
          return;
        }

        if (!response.ok) {
          throw new Error("Virhe haussa");
        }

        const data = await response.json();
        currentTicketId = ticketId;

        ticketDiv.innerHTML = `
          <p><b>Lipun ID:</b> ${data.lippu_id}</p>
          <p><b>Paikka:</b> ${data.paikka}</p>
          <p><b>Tapahtuma:</b> ${data.tapahtuma.nimi}</p>
          <p><b>Lipputyyppi:</b> ${data.lipputyyppi.nimi}</p>
          <p><b>${data.kaytetty ? `Lippu ${ticketId} on käytetty.` : `Lippu ${ticketId} ei ole vielä käytetty.`}</b></p>
        `;
        ticketDiv.className = "";

        useBtn.style.display = data.kaytetty ? "none" : "inline";
      } catch (err) {
        ticketDiv.textContent = "Virhe haussa tai lippua ei löytynyt.";
        ticketDiv.className = "error";
        useBtn.style.display = "none";
      }
    }

    // --- MARK AS USED ---
    async function markUsed() {
      if (!currentTicketId) return;
      const ticketDiv = document.getElementById("ticketInfo");
      const useBtn = document.getElementById("useButton");

      ticketDiv.textContent = "Päivitetään...";
      ticketDiv.className = "";

      try {
        const response = await fetch(`${API_BASE_URL}/liput/${currentTicketId}`, {
          method: "PATCH",
          headers: headers,
          body: JSON.stringify({ "kaytetty": true })
        });

        if (response.ok) {
          ticketDiv.textContent = `Lippu ${currentTicketId} merkitty käytetyksi!`;
          ticketDiv.className = "success";
          useBtn.style.display = "none";
        } else {
          ticketDiv.textContent = "Virhe päivityksessä.";
          ticketDiv.className = "error";
        }
      } catch (err) {
        ticketDiv.textContent = "Virhe päivityksessä.";
        ticketDiv.className = "error";
      }
    }
  </script>
</body>
</html>
