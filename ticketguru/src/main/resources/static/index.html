<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <title>TicketGuru MVP - Lipunmyynti Client</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .buy-button {
            background-color: green;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        .navigation {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        #sell-form {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            background: #fafafa;
        }

        #event-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-top: 20px;
        }

        .event-card {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.07);
        }

        .error {
            color: red;
        }

        .success {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🎫 Tapahtumien Lipunmyynti</h1>

    <div class="navigation">
       <!-- Local links -->
<!--
<a href="http://localhost:8080/salesreport" class="buy-button" style="background-color:#333;">Myyntiraportit</a>
<a href="http://localhost:8080/tickets/check" class="buy-button" style="background-color:#555;">Lipun Tarkistus</a>
<a href="http://localhost:8080/events/new" class="buy-button" style="background-color:#007bff;">Luo uusi Tapahtuma</a>
-->

<!-- Deployed links  for h2 database-->
<a href="https://demo-0-ticketguru-oktiimi.2.rahtiapp.fi/salesreport" class="buy-button" style="background-color:#333;">Myyntiraportit</a>
<a href="https://demo-0-ticketguru-oktiimi.2.rahtiapp.fi/tickets/check" class="buy-button" style="background-color:#555;">Lipun Tarkistus</a>
<a href="https://demo-0-ticketguru-oktiimi.2.rahtiapp.fi/events/new" class="buy-button" style="background-color:#007bff;">Luo uusi Tapahtuma</a>

        <form action="/logout" method="post" style="margin-left:auto;">
            <button type="submit" class="buy-button" style="background-color:#dc3545;">Kirjaudu ulos</button>
        </form>
    </div>

    <hr>

    <h2>Lipunmyynti</h2>

    <form id="sell-form" onsubmit="handlePurchase(event)">
        <label>Tapahtuma:</label><br>
        <select id="event-select" required></select><br><br>

        <label>Lipputyyppi:</label><br>
        <select id="tickettype-select" required></select><br><br>

        <label>Määrä:</label><br>
        <input type="number" id="quantity-input" min="1" value="1" required><br><br>

        <label>Ostajan sähköposti:</label><br>
        <input type="email" id="buyer-email" ><br><br>

        <label>Myyjän ID:</label><br>
        <input type="number" id="seller-id" value="1" min="1" required><br><br>

        <button type="submit" class="buy-button">Osta & Luo Myynti</button>
    </form>

    <p id="message-area"></p>

    <p id="loading">Ladataan tapahtumia...</p>
    <div id="event-list"></div>


<script>
   
    //const API_BASE_URL = "http://localhost:8080/api";
    // for H2 database - deployment
    const API_BASE_URL = "https://demo-0-ticketguru-oktiimi.2.rahtiapp.fi/api";
    let events = [];
    let ticketTypes = [];

    async function fetchData() {
        try {
            const eventsResponse = await fetch(`${API_BASE_URL}/events`);
            events = await eventsResponse.json();

            const typesResponse = await fetch(`${API_BASE_URL}/tickettypes`);
            ticketTypes = await typesResponse.json();

            document.getElementById("loading").style.display = "none";

            populateEventDropdown();
            populateTicketTypeDropdown();
            renderEvents();

        } catch (err) {
            document.getElementById("loading").innerHTML = `<p class='error'>Virhe tietojen haussa: ${err.message}</p>`;
        }
    }

    function populateEventDropdown() {
        const select = document.getElementById("event-select");
        select.innerHTML = "";

        events.forEach(e => {
            const opt = document.createElement("option");
            opt.value = e.eventId;
            opt.textContent = `${e.eventName} (${e.eventCity}) – ${e.eventDate}`;
            select.appendChild(opt);
        });
    }

    function populateTicketTypeDropdown() {
        const select = document.getElementById("tickettype-select");
        select.innerHTML = "";

        ticketTypes.forEach(t => {
            const opt = document.createElement("option");
            opt.value = t.ticketTypeId;
            opt.textContent = `${t.ticketName} (€${t.price.toFixed(2)})`;
            select.appendChild(opt);
        });
    }

    function renderEvents() {
        const list = document.getElementById("event-list");
        list.innerHTML = "";

        events.forEach(e => {
            const card = document.createElement("div");
            card.className = "event-card";
            card.innerHTML = `
                <h3>${e.eventName} (${e.eventCity})</h3>
                <p>Paikka: ${e.eventLocation}<br>
                Päivämäärä: ${e.eventDate}</p>
            `;
            list.appendChild(card);
        });
    }

    async function handlePurchase(event) {
        event.preventDefault();

        const messageArea = document.getElementById("message-area");
        messageArea.textContent = "Käsitellään ostoa...";

        const eventId = document.getElementById("event-select").value;
        const typeId = document.getElementById("tickettype-select").value;
        const quantity = parseInt(document.getElementById("quantity-input").value);
        const buyerEmail = document.getElementById("buyer-email").value;
        const sellerId = document.getElementById("seller-id").value;

        // Luo listan lipuista määrän mukaan
        const tickets = [];
        for (let i = 0; i < quantity; i++) {
            tickets.push({
                eventId: { eventId: eventId },
                ticketTypeId: { ticketTypeId: typeId }
            });
        }

        const selectedType = ticketTypes.find(t => t.ticketTypeId == typeId);
        const totalPrice = (selectedType.price * quantity).toFixed(2);

        const payload = {
            dateTime: new Date().toISOString().slice(0, 19),
            price: totalPrice,
            user: { id: sellerId },
            tickets: tickets
        };

        try {
            const response = await fetch(`${API_BASE_URL}/ticketsales?buyerEmail=${encodeURIComponent(buyerEmail)}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                messageArea.className = "success";
                messageArea.textContent = `Osto onnistui! Myynti ID: ${data.saleId}, Lippuja: ${quantity}, Hinta: €${totalPrice}`;
                document.getElementById("sell-form").reset();
            } else {
                messageArea.className = "error";
                messageArea.textContent = `Virhe: ${data.message || JSON.stringify(data)}`;
            }

        } catch (err) {
            messageArea.className = "error";
            messageArea.textContent = `Verkkovirhe: ${err.message}`;
        }
    }

    fetchData();
</script>

</body>
</html>
